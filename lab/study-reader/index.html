  var invented = [
    {id: 'inv-1', kind: 'invented', label: 'Invented 1', d: 3, area: 'nt', methods: ['modular', 'crt'], basics: ['nt-units', 'nt-crt'], hiddenOK: true,
      statement: R`<p>Let $R_k$ be the number whose decimal digits are $k$ ones, so $R_1 = 1$, $R_2 = 11$, $R_3 = 111$. For how many $k$ with $1 \le k \le 2026$ is $R_k$ divisible by $3367$?</p>`,
      solution: R`<p><b>Answer: 337.</b></p>
<p>$9R_k = 10^k - 1$ and $\gcd(9, 3367) = 1$, so $3367 \mid R_k$ exactly when $3367 \mid 10^k - 1$, that is, $10^k \equiv 1 \pmod{3367}$.</p>
<p>$3367 = 7 \cdot 13 \cdot 37$, three primes, so by the CRT this holds exactly when $10^k \equiv 1$ mod each of $7$, $13$, $37$, that is, when each order divides $k$.</p>
<p>Mod $7$: $10 \equiv 3$, whose powers run $3, 2, 6, 4, 5, 1$, so the order is $6$. Mod $13$: $10^2 \equiv 9$ and $10^3 \equiv 90 \equiv -1$, so $10^6 \equiv 1$ while $10^1, 10^2, 10^3 \not\equiv 1$: order $6$. Mod $37$: $10^3 = 1000 = 27 \cdot 37 + 1$, and $10, 10^2 \not\equiv 1$: order $3$.</p>
<p>So the condition is $\operatorname{lcm}(6, 6, 3) = 6 \mid k$, and there are $\lfloor 2026/6 \rfloor = 337$ such $k$.</p>`},
    {id: 'inv-2', kind: 'invented', label: 'Invented 2', d: 4, area: 'nt', methods: ['modular', 'crt'], basics: ['nt-units', 'nt-crt'], hiddenOK: true,
      statement: R`<p>For how many integers $n$ with $1 \le n \le 2026$ is $2^n + n$ divisible by $7$?</p>`,
      solution: R`<p><b>Answer: 289.</b></p>
<p>$\operatorname{ord}_7(2) = 3$ (the powers run $2, 4, 1$), so $2^n \bmod 7$ depends only on $n \bmod 3$: it is $1, 2, 4$ for $n \equiv 0, 1, 2$. The other term depends on $n \bmod 7$. So the condition depends only on the pair ($n \bmod 3$, $n \bmod 7$), and by the CRT each pair occurs exactly once in every $21$ consecutive integers.</p>
<p>The condition is $n \equiv -2^n \pmod 7$. For $n \equiv 0 \pmod 3$ it reads $n \equiv 6 \pmod 7$; for $n \equiv 1$, $n \equiv 5$; for $n \equiv 2$, $n \equiv 3$. These pairs are the classes $n \equiv 6, 19, 17 \pmod{21}$.</p>
<p>$2026 = 21 \cdot 96 + 10$. The integers $1, \dots, 2016$ contain $96 \cdot 3 = 288$ solutions, and among $2017, \dots, 2026$ (residues $1$ to $10$ mod $21$) only $2022 \equiv 6$ works. Total $289$.</p>`},
    {id: 'inv-3', kind: 'invented', label: 'Invented 3', d: 4, area: 'nt', methods: ['crt', 'polynomials', 'modular'], basics: ['nt-crt', 'nt-units'], hiddenOK: true,
      statement: R`<p>How many integers $x$ with $1 \le x \le 1729$ have $x^3 - 1$ divisible by $1729$?</p>`,
      solution: R`<p><b>Answer: 27.</b></p>
<p>$1729 = 7 \cdot 13 \cdot 19$. By the CRT the count is the product of the numbers of solutions of $x^3 \equiv 1$ mod $7$, mod $13$ and mod $19$ (and $1, \dots, 1729$ is one full set of residues mod $1729$).</p>
<p>Mod a prime $p$ there are at most three solutions. If $x^3 \equiv 1$ and $x \not\equiv 1$, then $p \mid (x - 1)(x^2 + x + 1)$ gives $x^2 + x + 1 \equiv 0$ by Euclid's lemma. If $s$ and $t$ both satisfy that, then $0 \equiv (s^2 + s + 1) - (t^2 + t + 1) = (s - t)(s + t + 1)$, so $t \equiv s$ or $t \equiv -1 - s$: at most two besides $1$.</p>
<p>Three occur for each prime: mod $7$, $1, 2, 4$ ($2^3 = 8$, $4^3 = 64 = 9 \cdot 7 + 1$); mod $13$, $1, 3, 9$ ($27 = 2 \cdot 13 + 1$, $729 = 56 \cdot 13 + 1$); mod $19$, $1, 7, 11$ ($343 = 18 \cdot 19 + 1$, $1331 = 70 \cdot 19 + 1$).</p>
<p>So there are $3 \cdot 3 \cdot 3 = 27$.</p>`},
    {id: 'inv-4', kind: 'invented', label: 'Invented 4', d: 5, area: 'nt', methods: ['modular', 'bijection'], basics: ['nt-units'], hiddenOK: true,
      statement: R`<p>For how many positive integers $n$ is the decimal expansion of $1/n$ purely periodic with smallest period exactly $6$? (Purely periodic: the repeating block starts right after the decimal point, as in $1/7 = 0.\overline{142857}$.)</p>`,
      solution: R`<p><b>Answer: 53.</b></p>
<p>For $n \ge 2$, $1/n$ is purely periodic with period $k$ (not necessarily the smallest) exactly when $n \mid 10^k - 1$. If $1/n = 0.\overline{a_1 \dots a_k}$, then $10^k/n = A + 1/n$ where $A$ is the block read as an integer, so $10^k - 1 = nA$. Conversely, if $10^k - 1 = nA$, then $0 \lt A \lt 10^k$ and $1/n = A/(10^k - 1) = A(10^{-k} + 10^{-2k} + \dots)$, which repeats the $k$-digit block of $A$.</p>
<p>So such $n$ are coprime to $10$, the periods that work are the $k$ with $10^k \equiv 1 \pmod n$, which are the multiples of $\operatorname{ord}_n(10)$, and the smallest period is $\operatorname{ord}_n(10)$. Order exactly $6$ means: $n$ divides $10^6 - 1 = 999999$ but neither $10^3 - 1 = 999$ (orders $1$ and $3$) nor $10^2 - 1 = 99$ (orders $1$ and $2$).</p>
<p>$999999 = 3^3 \cdot 7 \cdot 11 \cdot 13 \cdot 37$ has $4 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 64$ divisors; $999 = 3^3 \cdot 37$ has $8$; $99 = 3^2 \cdot 11$ has $6$; the divisors of both are the divisors of $\gcd(999, 99) = 9$, which are $3$. So $64 - (8 + 6 - 3) = 53$.</p>`},
    {id: 'inv-5', kind: 'invented', label: 'Invented 5', d: 2, area: 'nt', methods: ['crt'], basics: ['nt-crt'], hiddenOK: true,
      statement: R`<p>Find the smallest positive integer $n$ such that $2$ divides $n$, $3$ divides $n + 1$, $5$ divides $n + 2$, $7$ divides $n + 3$ and $11$ divides $n + 4$.</p>`,
      solution: R`<p><b>Answer: 788.</b></p>
<p>The conditions say $n \equiv 0 \pmod 2$, $n \equiv 2 \pmod 3$, $n \equiv 3 \pmod 5$, $n \equiv 4 \pmod 7$ and $n \equiv 7 \pmod{11}$. The moduli are pairwise coprime, so by the CRT there is exactly one solution mod $2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 = 2310$, and the answer is that residue.</p>
<p>Glue one modulus at a time. $n \equiv 0 \pmod 2$ and $n \equiv 2 \pmod 3$ give $n \equiv 2 \pmod 6$. Of $2, 8, 14, 20, 26$ the one that is $\equiv 3 \pmod 5$ is $8$, so $n \equiv 8 \pmod{30}$. Of $8, 38, 68, 98, 128, 158, 188$ the one that is $\equiv 4 \pmod 7$ is $158$, so $n \equiv 158 \pmod{210}$. Finally $158 \equiv 4$ and $210 \equiv 1 \pmod{11}$, so $158 + 210k \equiv 4 + k$, which is $\equiv 7$ for $k = 3$: $n = 158 + 630 = 788$.</p>
<p>Check: $788 = 2 \cdot 394$, $789 = 3 \cdot 263$, $790 = 5 \cdot 158$, $791 = 7 \cdot 113$, $792 = 11 \cdot 72$.</p>`},
    {id: 'inv-6', kind: 'invented', label: 'Invented 6', d: 3, area: 'cp', methods: ['linearity'], basics: [], hiddenOK: true,
      statement: R`<p>Twelve people sit down at random around a round table with twelve seats; six wear red and six wear blue. What is the expected number of pairs of neighbours who wear the same colour?</p>`,
      solution: R`<p><b>Answer: $60/11$.</b></p>
<p>There are $12$ pairs of neighbouring seats. For one such pair, whatever the first person wears, the second is one of the other $11$ people, $5$ of whom share that colour. So the pair matches with probability $5/11$.</p>
<p>The number of matching pairs is a sum of $12$ indicators, and expectation adds even though the indicators are dependent: $12 \cdot 5/11 = 60/11$.</p>`},
    {id: 'inv-7', kind: 'invented', label: 'Invented 7', d: 5, area: 'cp', methods: ['bijection', 'inequalities', 'construction'], basics: [], hiddenOK: true,
      statement: R`<p>Nine players play a round robin: every two of them play once, and there are no draws. Call a set of three players a <i>cycle</i> if each of the three beat exactly one of the other two. What is the largest possible number of cycles?</p>`,
      solution: R`<p><b>Answer: 30.</b></p>
<p>Count the triples that are not cycles. In a triple the three games give within-triple win counts $1, 1, 1$ (a cycle) or $2, 1, 0$; so each non-cycle has exactly one player who beat both others. Player $i$ with $w_i$ wins in total is that player for $\binom{w_i}{2}$ triples. Hence the number of cycles is $\binom{9}{3} - \sum_i \binom{w_i}{2} = 84 - \sum_i \binom{w_i}{2}$.</p>
<p>The wins add up to the number of games, $\binom{9}{2} = 36$. Now $\sum_i \binom{w_i}{2} = \tfrac12 \sum_i w_i^2 - 18$, and by Cauchy–Schwarz $\sum_i w_i^2 \ge (\sum_i w_i)^2/9 = 144$. So $\sum_i \binom{w_i}{2} \ge 54$, and there are at most $84 - 54 = 30$ cycles.</p>
<p>Equality: seat the players at positions $0, \dots, 8$ around a circle and let each one beat the next four clockwise. Every player then has $4$ wins, so there are exactly $30$ cycles.</p>`},
    {id: 'inv-8', kind: 'invented', label: 'Invented 8', d: 3, area: 'gr', methods: ['pigeonhole', 'bijection'], basics: [], hiddenOK: true,
      statement: R`<p>Ten people form eight committees of four members each. Prove that some two of the committees have at least two members in common.</p>`,
      solution: R`<p>Count pairs of people who sit on a committee together, committee by committee. Each committee contains $\binom{4}{2} = 6$ pairs, so the eight committees contain $48$ pairs, counted with repetition. There are only $\binom{10}{2} = 45$ different pairs of people, so by pigeonhole some pair appears in two different committees, and those two committees share at least those two members.</p>`},
    {id: 'inv-9', kind: 'invented', label: 'Invented 9', d: 4, area: 'gr', methods: ['invariant', 'parity', 'construction'], basics: ['nt-divisibility'], hiddenOK: true,
      statement: R`<p>A row of $2026$ lamps, numbered $1$ to $2026$, are all off. A move picks three adjacent lamps and switches each of them (off to on, on to off). For which pairs $j \lt k$ can a sequence of moves leave exactly lamps $j$ and $k$ on?</p>`,
      solution: R`<p><b>Answer: exactly when $3 \mid k - j$.</b></p>
<p><i>Necessary.</i> Sort the lamps into three classes by their number mod $3$. Three adjacent lamps contain one lamp of each class, so a move changes the number of lit lamps in every class by one: the three parities flip together. They start equal (all even), so they stay equal. If exactly lamps $j$ and $k$ are on with $j \not\equiv k \pmod 3$, two classes have an odd count and one an even count, which is impossible.</p>
<p><i>Sufficient.</i> The moves at $i$ and at $i + 1$ (lamps $i, i+1, i+2$ and lamps $i+1, i+2, i+3$) together switch exactly lamps $i$ and $i + 3$. Doing this for $i = j, j + 3, \dots, k - 3$ switches lamps $j$ and $k$ once each and every lamp in between twice, that is, not at all.</p>`},
    {id: 'inv-10', kind: 'invented', label: 'Invented 10', d: 4, area: 'gr', methods: ['inequalities'], basics: [], hiddenOK: true,
      statement: R`<p>Which is larger, $2^{100}$ or $3^{63}$? Prove your answer without computing either number.</p>`,
      solution: R`<p><b>Answer: $2^{100}$.</b></p>
<p>$3^{63} = (3^7)^9 = 2187^9$ and $2^{100} = 2 \cdot (2^{11})^9 = 2 \cdot 2048^9$, so it is enough to show $(2187/2048)^9 \lt 2$.</p>
<p>$2187/2048 = 1 + 139/2048$, and $1 + t \le e^t$, so $(2187/2048)^9 \le e^{9 \cdot 139/2048} = e^{1251/2048}$. Since $3 \cdot 1251 = 3753 \lt 4096 = 2 \cdot 2048$, the exponent is below $2/3$. Finally $e^{2/3} \lt 2$ because $e^2 \lt 8$: indeed $e \lt 2.8$ and $2.8^2 = 7.84$.</p>`},
    /* Three number theory problems a little below Putnam A1 (d 2.3 to 2.5), so the first nt picks at
       r 3 land inside the stretch band (target d 2.46, band 2.26 to 2.65). Answers checked by brute force. */
    {id: 'inv-11', kind: 'invented', label: 'Invented 11', d: 2.4, area: 'nt', methods: ['modular'], basics: ['nt-units'], hiddenOK: true,
      statement: R`<p>What are the last two digits of $7^{7^7}$? (The exponent is $7^7$, not $49$.)</p>`,
      solution: R`<p><b>Answer: 43.</b></p>
<p>$7^2 = 49$ and $7^4 = 49^2 = 2401 \equiv 1 \pmod{100}$, so the order of $7$ mod $100$ is $4$ (the powers run $7, 49, 43, 1$), and $7^k \bmod 100$ depends only on $k \bmod 4$.</p>
<p>The exponent mod $4$: $7 \equiv -1 \pmod 4$, so $7^7 \equiv (-1)^7 = -1 \equiv 3 \pmod 4$.</p>
<p>So $7^{7^7} \equiv 7^3 = 343 \equiv 43 \pmod{100}$. Euler's theorem would reduce the exponent mod $\varphi(100) = 40$ instead, which also works ($7^7 \equiv 23 \pmod{40}$ and $23 \equiv 3 \pmod 4$); the order is the shorter route.</p>`},
    {id: 'inv-12', kind: 'invented', label: 'Invented 12', d: 2.5, area: 'nt', methods: ['modular', 'crt'], basics: ['nt-units', 'nt-crt'], hiddenOK: true,
      statement: R`<p>Prove that $n^5 - n$ is divisible by $30$ for every integer $n$.</p>`,
      solution: R`<p>$30 = 2 \cdot 3 \cdot 5$, three distinct primes. It is enough to show that each of them divides $n^5 - n$: a number divisible by pairwise coprime $2$, $3$ and $5$ is divisible by their product (the CRT, or Euclid's lemma used twice).</p>
<p><i>Mod 5.</i> If $5 \nmid n$, then $\gcd(n, 5) = 1$ and Euler's theorem with $\varphi(5) = 4$ gives $n^4 \equiv 1$, so $n^5 \equiv n$. If $5 \mid n$, both sides are $0$.</p>
<p><i>Mod 3.</i> If $3 \nmid n$, then $n^2 \equiv 1$ (Euler, $\varphi(3) = 2$), so $n^5 = n \cdot (n^2)^2 \equiv n$. If $3 \mid n$, both sides are $0$.</p>
<p><i>Mod 2.</i> $n^5$ and $n$ have the same parity.</p>
<p>So $2$, $3$ and $5$ all divide $n^5 - n$, and so does $30$.</p>`},
    {id: 'inv-13', kind: 'invented', label: 'Invented 13', d: 2.3, area: 'nt', methods: ['modular', 'crt'], basics: ['nt-divisibility', 'nt-crt'], hiddenOK: true,
      statement: R`<p>For how many integers $n$ with $1 \le n \le 1000$ is $n^2 + n$ divisible by $6$?</p>`,
      solution: R`<p><b>Answer: 666.</b></p>
<p>$n^2 + n = n(n + 1)$ is a product of two consecutive integers, so it is always even. Since $\gcd(2, 3) = 1$, $6 \mid n(n + 1)$ exactly when $3 \mid n(n + 1)$, and since $3$ is prime (Euclid's lemma) that happens exactly when $3 \mid n$ or $3 \mid n + 1$, that is, $n \equiv 0$ or $2 \pmod 3$.</p>
<p>Among $1, \dots, 999$ each residue mod $3$ occurs $333$ times, and $1000 \equiv 1 \pmod 3$ adds nothing. So there are $2 \cdot 333 = 666$.</p>`},
    /* Six number theory warm-ups (d 0.8 to 1.8) for the low end of the scale: after two misses at r near 2.2 the
       eased target is d near 0.7, and once a hold ends the ease-off the band sits near d 1.5 to 2.0. With
       inv-5 (d 2) they keep eased and post-miss picks at or below the stretch target. Answers checked by brute force. */
    {id: 'inv-14', kind: 'invented', label: 'Invented 14', d: 0.8, area: 'nt', methods: ['modular'], basics: ['nt-units'], hiddenOK: true,
      statement: R`<p>What is the remainder when $3^{2026}$ is divided by $8$?</p>`,
      solution: R`<p><b>Answer: 1.</b></p>
<p>$3^2 = 9 \equiv 1 \pmod 8$, so $3^{2026} = (3^2)^{1013} \equiv 1^{1013} = 1$.</p>`},
    {id: 'inv-15', kind: 'invented', label: 'Invented 15', d: 1, area: 'nt', methods: ['modular'], basics: ['nt-units'], hiddenOK: true,
      statement: R`<p>What is the last decimal digit of $7^{2026}$?</p>`,
      solution: R`<p><b>Answer: 9.</b></p>
<p>Mod $10$ the powers of $7$ run $7, 9, 3, 1$ and then repeat, since $7^4 = 2401 \equiv 1$. So $7^k \bmod 10$ depends only on $k \bmod 4$. As $2026 = 4 \cdot 506 + 2$, $7^{2026} \equiv 7^2 = 49 \equiv 9 \pmod{10}$.</p>`},
    {id: 'inv-16', kind: 'invented', label: 'Invented 16', d: 1.2, area: 'nt', methods: ['crt'], basics: ['nt-crt'], hiddenOK: true,
      statement: R`<p>Find the smallest positive integer $x$ with $x \equiv 1 \pmod 4$, $x \equiv 2 \pmod 5$ and $x \equiv 3 \pmod 7$.</p>`,
      solution: R`<p><b>Answer: 17.</b></p>
<p>$4$, $5$ and $7$ are pairwise coprime, so by the CRT there is exactly one solution mod $140$. The numbers $\equiv 2 \pmod 5$ run $2, 7, 12, 17, \dots$, and the first that is $\equiv 1 \pmod 4$ is $17$; so the first two conditions say $x \equiv 17 \pmod{20}$. And $17 = 2 \cdot 7 + 3$ already satisfies the third, so $x \equiv 17 \pmod{140}$ and the smallest positive solution is $17$.</p>`},
    {id: 'inv-17', kind: 'invented', label: 'Invented 17', d: 1.5, area: 'nt', methods: ['crt'], basics: ['nt-crt'], hiddenOK: true,
      statement: R`<p>Find the smallest positive integer $n$ such that $6$ divides $n + 1$, $10$ divides $n + 3$ and $7$ divides $n$.</p>`,
      solution: R`<p><b>Answer: 77.</b></p>
<p>The conditions are $n \equiv 5 \pmod 6$, $n \equiv 7 \pmod{10}$ and $n \equiv 0 \pmod 7$. The moduli $6$ and $10$ are not coprime, so first check that the two conditions agree on what they share: both say $n$ is odd. Split them into prime parts: $n$ odd, $n \equiv 2 \pmod 3$ and $n \equiv 2 \pmod 5$, which together say $n \equiv 17 \pmod{30}$. (Had they disagreed mod $2$, there would be no solution.)</p>
<p>Of $17, 47, 77$, the first multiple of $7$ is $77 = 7 \cdot 11$. Check: $78 = 6 \cdot 13$ and $80 = 10 \cdot 8$.</p>`},
    {id: 'inv-18', kind: 'invented', label: 'Invented 18', d: 1.6, area: 'nt', methods: ['modular'], basics: ['nt-divisibility'], hiddenOK: true,
      statement: R`<p>For how many integers $n$ with $1 \le n \le 200$ is $n^2 + 1$ divisible by $5$?</p>`,
      solution: R`<p><b>Answer: 80.</b></p>
<p>Whether $5$ divides $n^2 + 1$ depends only on $n \bmod 5$. The squares of $0, 1, 2, 3, 4$ are $\equiv 0, 1, 4, 4, 1 \pmod 5$, so $n^2 + 1 \equiv 0$ exactly when $n \equiv 2$ or $3 \pmod 5$. Each residue occurs $40$ times among $1, \dots, 200$, so there are $80$.</p>`},
    {id: 'inv-19', kind: 'invented', label: 'Invented 19', d: 1.8, area: 'nt', methods: ['modular'], basics: ['nt-units'], hiddenOK: true,
      statement: R`<p>What is the remainder when $1 + 3 + 3^2 + \dots + 3^{2025}$ is divided by $13$?</p>`,
      solution: R`<p><b>Answer: 1.</b></p>
<p>$3^3 = 27 = 2 \cdot 13 + 1$, so mod $13$ the powers of $3$ run $1, 3, 9, 1, 3, 9, \dots$ with period $3$. The sum has the $2026$ terms $3^0, \dots, 3^{2025}$. Group them in threes from the start: each group is $\equiv 1 + 3 + 9 = 13 \equiv 0$. The $675$ groups use up $3^0, \dots, 3^{2024}$, and the one term left is $3^{2025} = (3^3)^{675} \equiv 1$.</p>`}
  ];

  /* =====================================================================================
     KATAS. Specs are exact: reset, widths, bit order and timing, checked after every rising
     edge. Skeletons hold ports only. Hidden katas never name the technique.
     ===================================================================================== */
  var katas = [
    {id: 'k-shift', title: '4-bit shift register with enable', d: 2.5, level: 'simple', hidden: false, area: 'dd',
      basics: ['dd-lfsr'], methods: ['shift'],
      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['en', 'input', 1], ['din', 'input', 1], ['q', 'output', 4]],
      spec: R`<p>A 4-bit shift register with enable.</p>
<ul>
<li><code>rst</code> (synchronous, active high): on a rising edge with <code>rst</code> high, <code>q</code> becomes <code>4'b0000</code>. <code>rst</code> wins over <code>en</code>.</li>
<li><code>en</code>: on a rising edge with <code>rst</code> low and <code>en</code> high, the sampled <code>din</code> enters at bit 0, every bit moves one place toward bit 3, and the old bit 3 is lost.</li>
<li>With <code>en</code> low (and <code>rst</code> low), <code>q</code> holds.</li>
</ul>
<p>Example after reset, <code>en</code> high, <code>din</code> = 1, 0, 1, 1: <code>q</code> = 0001, 0010, 0101, 1011. Outputs are checked after every rising edge.</p>`,

endmodule

    {id: 'k-lfsr', title: '8-bit Galois LFSR, taps 0xB8', d: 3, level: 'simple', hidden: false, area: 'dd',
      basics: ['dd-lfsr'], methods: ['lfsr', 'shift'],
      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['en', 'input', 1], ['seed', 'input', 8], ['state', 'output', 8], ['bit_out', 'output', 1]],
      spec: R`<p>An 8-bit Galois LFSR for x<sup>8</sup> + x<sup>6</sup> + x<sup>5</sup> + x<sup>4</sup> + 1, moving toward bit 0, tap mask <code>8'hB8</code>.</p>
<ul>
<li><code>rst</code> (synchronous, active high): on a rising edge with <code>rst</code> high, <code>state</code> takes the value on <code>seed</code>. <code>rst</code> wins over <code>en</code>.</li>
<li><code>en</code>: on a rising edge with <code>rst</code> low and <code>en</code> high, every bit of <code>state</code> moves one place toward bit 0 (bit 7 receives 0), and if the bit that left bit 0 was 1, <code>8'hB8</code> is XORed into the result. With <code>en</code> low, <code>state</code> holds.</li>
<li><code>bit_out</code> equals <code>state[0]</code> at all times.</li>
</ul>
<p>Example, seed <code>8'h01</code>, <code>en</code> high: 01, B8, 5C, 2E, 17, B3, E1, C8, 64, … From any nonzero seed the state is back at the seed after exactly 255 enabled steps. Outputs are checked after every rising edge.</p>`,

);

endmodule

    {id: 'k-crc', title: 'Serial CRC-8 (0x07, init 0, MSB first)', d: 4, level: 'simple', hidden: false, area: 'dd',
      basics: ['dd-crc', 'dd-lfsr'], methods: ['crc', 'lfsr'],
      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['din', 'input', 1], ['valid', 'input', 1], ['crc', 'output', 8]],
      spec: R`<p>Serial CRC-8: generator x<sup>8</sup> + x<sup>2</sup> + x + 1 (<code>8'h07</code>), initial value <code>8'h00</code>, no reflection, no final XOR.</p>
<ul>
<li>One message bit arrives on <code>din</code> at each rising edge where <code>valid</code> is high, each byte most significant bit first. Edges with <code>valid</code> low are not part of the message, and <code>crc</code> holds.</li>
<li>After the edge that accepts a bit, <code>crc</code> is the CRC of every bit accepted since the last reset.</li>
<li><code>rst</code> (synchronous, active high) starts a new message: <code>crc</code> becomes <code>8'h00</code>. <code>rst</code> wins over <code>valid</code>.</li>
</ul>
<p>Check values: the single byte <code>8'h01</code> gives <code>8'h07</code>, and the nine ASCII bytes of <code>"123456789"</code> give <code>8'hF4</code>. Outputs are checked after every rising edge.</p>`,

  input        rst,

  input        valid,

);

endmodule
`},
    {id: 'k-uart', title: 'UART transmitter, 8N1', d: 5, level: 'hard', hidden: false, area: 'dd',
      basics: ['dd-lfsr'], methods: ['counter', 'shift', 'fsm'],
      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['start', 'input', 1], ['data', 'input', 8], ['tx', 'output', 1], ['busy', 'output', 1]],
      spec: R`<p>UART transmitter, 8N1, <code>CLKS_PER_BIT</code> = 4 clock cycles per bit.</p>
<ul>
<li>Idle: <code>tx</code> = 1, <code>busy</code> = 0.</li>
<li>A rising edge with <code>start</code> high while <code>busy</code> is 0 accepts <code>data</code>; call it edge 0. Right after edge 0, <code>tx</code> = 0 (start bit) and <code>busy</code> = 1. Right after edge 4k + 4, for k = 0 … 7, <code>tx</code> = <code>data[k]</code> (least significant bit first). Right after edge 36, <code>tx</code> = 1 (stop bit). Right after edge 40, <code>busy</code> = 0 and <code>tx</code> stays 1. Each bit lasts exactly 4 cycles; a frame lasts 40.</li>
<li><code>busy</code> is 1 right after edges 0 through 39. A <code>start</code> sampled while <code>busy</code> is 1 is ignored; that includes edge 40, so the earliest next frame is accepted at edge 41. Only the value of <code>data</code> at edge 0 matters.</li>
<li><code>rst</code> (synchronous, active high) aborts any frame: right after the edge, <code>tx</code> = 1 and <code>busy</code> = 0. <code>rst</code> wins over <code>start</code>.</li>
</ul>
<p>Outputs are checked after every rising edge.</p>`,
      skeleton: R`// UART transmitter, 8N1
module uart_tx (
  input        clk,
  input        rst,
  input        start,
  input  [7:0] data,
  output       tx,
  output       busy
);
  parameter CLKS_PER_BIT = 4;

endmodule
`},
    {id: 'k-badframe', title: 'Frame checker', d: 5.5, level: 'hard', hidden: true, area: 'dd',
      basics: ['dd-crc', 'dd-lfsr'], methods: ['crc'],
      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['in_valid', 'input', 1], ['in_byte', 'input', 8], ['in_last', 'input', 1], ['frame_done', 'output', 1], ['frame_bad', 'output', 1]],
      spec: R`<p>Bytes arrive one per accepted clock edge. Flag every frame whose last byte is not the check value of the bytes before it.</p>
<ul>
<li><b>Input.</b> At each rising edge with <code>in_valid</code> high, the byte on <code>in_byte</code> is accepted. A frame is the run of accepted bytes from the first one after reset, or after the previous frame's last byte, up to and including the byte accepted with <code>in_last</code> high. Every frame has at least two bytes: one or more payload bytes, then the check byte. Edges with <code>in_valid</code> low accept nothing, and <code>in_last</code> is ignored on them.</li>
<li><b>Check value.</b> Write the payload bits in arrival order, each byte most significant bit first, as b<sub>1</sub>, b<sub>2</sub>, …, b<sub>k</sub>. Form P(x) = b<sub>1</sub>x<sup>k+7</sup> + b<sub>2</sub>x<sup>k+6</sup> + … + b<sub>k</sub>x<sup>8</sup>, with coefficients added and multiplied mod 2, and divide it by x<sup>8</sup> + x<sup>2</sup> + x + 1. The remainder c<sub>7</sub>x<sup>7</sup> + … + c<sub>1</sub>x + c<sub>0</sub> is the check value: the byte whose bit i is c<sub>i</sub>.</li>
<li><b>Output.</b> Right after the edge that accepts a frame's last byte, <code>frame_done</code> = 1, and <code>frame_bad</code> = 1 if that byte differs from the check value of the frame's payload, else 0. After every other edge both are 0. A new frame may begin at the very next edge.</li>
<li><b>Reset.</b> <code>rst</code> (synchronous, active high) drops any partial frame and sets both outputs to 0. It wins over everything else.</li>
</ul>
<p>Examples: the payload <code>8'hA5</code> has check value <code>8'h72</code>; the payload <code>8'h31 8'h32 8'h33</code> has check value <code>8'hC0</code>. Outputs are checked after every rising edge.</p>`,
      skeleton: R`// frame checker
module frame_check (
  input        clk,
  input        rst,
  input        in_valid,
  input  [7:0] in_byte,
  input        in_last,
  output       frame_done,
  output       frame_bad
);

endmodule
`},
    /* Two katas added at integration, so the kata slots can sit near the stretch band at the starting
       dd rating (r 4: target d 3.46, hidden-topic pitch d 2.46). Reference designs live in
       test/kata-solutions.txt, never in the page. */
    {id: 'k-deser', title: 'Byte deserializer', d: 3.5, level: 'simple', hidden: false, area: 'dd',

      ports: [['clk', 'input', 1], ['rst', 'input', 1], ['din', 'input', 1], ['valid', 'input', 1], ['byte_out', 'output', 8], ['byte_valid', 'output', 1]],
      spec: R`<p>Collect a serial bit stream into bytes.</p>
<ul>
<li>A bit is accepted from <code>din</code> at each rising edge where <code>valid</code> is high. Edges with <code>valid</code> low accept nothing. Bytes arrive most significant bit first, back to back: bits 1 to 8 after reset are the first byte, bits 9 to 16 the second, and so on.</li>
<li>Right after the edge that accepts the 8th bit of a byte, <code>byte_valid</code> = 1 and <code>byte_out</code> holds that byte. <code>byte_valid</code> is 0 after every other edge, and <code>byte_out</code> keeps the last complete byte until the next one completes.</li>
<li><code>rst</code> (synchronous, active high) drops a partial byte: right after it <code>byte_out</code> = <code>8'h00</code>, <code>byte_valid</code> = 0, and the next accepted bit is the first bit of a new byte. <code>rst</code> wins over <code>valid</code>.</li>
</ul>
<p>Example: the accepted bits 1, 0, 1, 0, 0, 1, 0, 1 give <code>byte_out</code> = <code>8'hA5</code> with <code>byte_valid</code> = 1 right after the eighth. Outputs are checked after every rising edge.</p>`,

    {id: 'k-pattern', title: 'Pattern flag', d: 3, level: 'simple', hidden: true, area: 'dd',

      spec: R`<p>Watch a bit stream for the pattern 1, 1, 0, 1.</p>

<li>Right after an edge that accepts a bit, <code>hit</code> = 1 exactly when the last four bits accepted since reset are 1, 1, 0, 1, oldest first. Matches may overlap: the accepted bits 1, 1, 0, 1, 1, 0, 1 raise <code>hit</code> after the 4th and after the 7th.</li>
<li>Right after an edge with <code>valid</code> low, <code>hit</code> = 0.</li>
<li><code>rst</code> (synchronous, active high) forgets every bit accepted so far and makes <code>hit</code> 0; a match needs four bits accepted after it. <code>rst</code> wins over <code>valid</code>.</li>

  var rewrites = {
    'nt-moves': {
      'cue-exponent': R`<li data-a="cue-exponent"><p><b>A huge exponent, a fixed modulus.</b> When a statement asks about $a^N \bmod n$ with $N$ far too large to compute, the exponent matters only through a remainder. If $\gcd(a, n) = 1$, the powers of $a$ mod $n$ cycle from the very start with period $\operatorname{ord}_n(a)$, so $a^N \equiv a^{N \bmod \operatorname{ord}_n(a)}$ (<a class="ref" data-to="nt-units#order-thm">order</a>).</p><p>You rarely know the order in advance, but it divides $\varphi(n)$ (<a class="ref" data-to="nt-units#euler-thm">Euler</a>), so reducing $N$ mod $\varphi(n)$ is always safe, and mod the order is sharper. See the cycle once: mod $5$ the powers of $3$ run $3, 4, 2, 1, 3, 4, \dots$, period $4$. If $\gcd(a, n) \gt 1$ the powers still repeat eventually, but not from the start: split the modulus first (next cue).</p></li>`,
      'cue-split': R`<li data-a="cue-split"><p><b>A composite modulus.</b> If $n = n_1 n_2 \cdots n_k$ with pairwise coprime factors, a congruence mod $n$ holds exactly when it holds mod every $n_i$, and a residue mod $n$ carries the same information as its list of residues mod the $n_i$ (<a class="ref" data-to="nt-crt#crt">CRT</a>). So one question mod $n$ becomes $k$ smaller ones.</p><p>Split all the way to prime powers, as in $360 = 8 \cdot 9 \cdot 5$. Each piece may need a different tool (a base sharing the piece's prime is handled by hand, a unit base by its order), and one of them is often trivial. Glue at the very end, by Theorem 1 of the CRT page or by trying the few candidates.</p></li>`,
      'cue-two-periods': R`<li data-a="cue-two-periods"><p><b>Two conditions that repeat with different periods.</b> Suppose whether $n$ works depends on $n \bmod p$ through one part of the condition and on $n \bmod q$ through another. Then it depends only on the pair ($n \bmod p$, $n \bmod q$). When $\gcd(p, q) = 1$, the <a class="ref" data-to="nt-crt#crt">CRT</a> says this pair takes each of its $pq$ values exactly once in every block of $pq$ consecutive integers.</p><p>So counting the $n$ that work in a block is counting the pairs that work, and a long range is whole blocks plus a short tail. For instance, "$n$ even" and "$n \equiv 1 \pmod 3$" together say $n \equiv 4 \pmod 6$: one class in six.</p></li>`,
      'trap-cancel': R`<li data-a="trap-cancel"><p><b>Cancelling needs coprimality.</b> From $ac \equiv bc \pmod n$ you may conclude $a \equiv b \pmod n$ only when $\gcd(c, n) = 1$: then $c$ is a <a class="ref" data-to="nt-units#unit-gcd">unit</a>, and multiplying both sides by its inverse cancels it.</p><p>Otherwise the congruence only says $n \mid (a - b)c$, and part of $n$ can divide $c$ instead of $a - b$. In $4 \cdot 2 \equiv 4 \cdot 5 \pmod{12}$, the factor $4$ takes $4$ out of the $12$, and all that is left is $2 \equiv 5 \pmod 3$.</p></li>`
    },
    'dd-framing': {
      'fr-timing': R`<div data-a="fr-timing"><p><b>Bit timing by counting.</b> The clock is much faster than the bit rate, so each bit occupies $N$ = <code>CLKS_PER_BIT</code> cycles. A counter running $0, 1, \dots, N - 1, 0, \dots$ marks the cycle where one bit ends and the next begins: its wrap. A transmitter needs only that. At each wrap it moves to the next bit of the frame, for instance by moving a register that holds the frame (the <a class="ref" data-to="dd-lfsr#shift">shift register</a>), and it counts wraps to know when the frame is over.</p><p>Draw the waveform before writing code: with $N = 4$, the start bit fills the 4 cycles after the accepting edge, data bit 0 the next 4, and so on. A receiver works the other way round: from the falling edge that opens the start bit it infers the boundaries, and samples each bit near its middle, about $N/2$ cycles after a boundary.</p></div>`
    }

  function sget(k, d) { try { return SR.store ? SR.store.get(k, d) : d; } catch (e) { return d; } }

  function fresh(k) {

  /* ---------- one view of one kata: inline in a doc (o.ctx) or in a sheet (o.sheet) ---------- */

    /* ----- 1. the design call ----- */

          '<div class="sr-row kt-padtools"><button type="button" data-k="undo">Undo</button><button type="button" data-k="clear">Clear sketch</button></div>' +
          '<input type="text" class="kt-line" maxlength="200" placeholder="Your call, one line" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your call, one line">' +

    /* ----- 2. the editor and the testbench ----- */
    function renderCode(s) {
      var sec = q('.kt-code');

      if (!s.committed) { sec.innerHTML = '<div class="sr-kick">RTL</div><p class="sr-hint">' + esc(TEXT.editorLocked) + '</p>'; return; }
      sec.innerHTML = '<div class="sr-kick">RTL</div>' +
        '<div class="kt-ed"><div class="kt-gut" aria-hidden="true"></div><textarea class="kt-src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="RTL editor"></textarea></div>' +

    function settle(s, how) {

    function showResult(res, s, entry) {

      var h;
      if (res.error) {

      } else if (res.ok) {

        h = '<div class="kt-res pass"><div class="kt-big">PASS</div><div>' + res.cycles + ' cycles; every output matched the reference model.' +
          (entry && entry.practice ? ' Practice run.' : '') + '</div><div class="kt-wave">' + waveSvg(model, widths, res.trace, 0, n, null) + '</div>' +
          '<div class="sr-hint">Cycles 0 to ' + (n - 1) + ' of ' + res.cycles + '.</div></div>';

      gaveUp: false, gaveUpAt: null, verdict: null, help: false, settledAt: null, ms: null,
      called: [], calledNone: false, calledDone: false, took: [], tookInit: false, tookDone: false,
      hidden: null, reach: null, recorded: false, res: null };
  }
  /* The engine has a record this state does not show (local state lost, or recorded from another view). */
  function adopt(s, rec) {
    s.phase = 'settled';
    s.recorded = true;
    s.verdict = rec.verdict === 'held' && rec.help && !s.gaveUp ? 'help' : rec.verdict;
    s.help = !!rec.help;
    s.res = copy(rec);
    s.settledAt = s.settledAt || rec.t || Date.now();
    if (s.ms == null && rec.ms != null) s.ms = rec.ms;
    if (s.conf == null && rec.confidence != null) s.conf = rec.confidence;
    if (typeof rec.hidden === 'boolean') s.hidden = rec.hidden;
    if (typeof rec.reach === 'boolean') s.reach = rec.reach;
    if (!rec.methodsPending || rec.score === null) {
      s.calledDone = s.tookDone = true;
      s.called = (rec.called || []).slice();
      s.took = (rec.took || []).slice();
      s.calledNone = !s.called.length;
    } else s.tookDone = false;
  }
  function readState(id) {
    var s = SR.store.get(KEY + id, null);
    if (!s || typeof s !== 'object' || s.v !== 1 || s.id !== id || !Array.isArray(s.call) || !Array.isArray(s.work)) s = fresh(id);
    if (!Array.isArray(s.called)) s.called = [];
    if (!Array.isArray(s.took)) s.took = [];
    var rec = hasE('settled') ? ecall('settled', id) : null;
    if (rec && (s.phase !== 'settled' || !s.recorded)) adopt(s, rec);
    else if (!rec && s.recorded && SR.engine) s = fresh(id); /* the engine was reset */
    return s;
  }
  function writeState(s, src) {
    SR.store.set(KEY + s.id, s);
    SR.bus.emit('problem:state', { id: s.id, src: src || 0, phase: s.phase });
  }
  /* 'new' (nothing written), 'call' (call ink, not committed), 'attempt', 'settled' (verdict given, not all
     recorded yet), 'done'. */
  function statusOf(id) {
    var s = readState(id);
    if (s.phase === 'settled') return s.recorded && (s.tookDone || s.verdict === 'moot') ? 'done' : 'settled';
    if (s.phase === 'attempt') return 'attempt';
    return s.call.length ? 'call' : 'new';
  }
  function verdictText(s) {
    var v = s.verdict;
    if (v === 'help') return 'held after help';
    if (v === 'held' && s.gaveUp) return 'held after giving up';
    if (s.gaveUp && (v === 'missed' || v === 'blind')) return v + ' (gave up)';
    return v || '';
  }

  /* ---------- ink backgrounds (paper units) ---------- */
  function commitLine(ctx, w, h) {
    var y = h - 40, c = SR.css('--muted') || '#6b675f';
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(w - 24, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = c;
    ctx.font = '13px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.fillText('commit line', 24, y + 22);
  }
  function ruled(ctx, w, h) {
    ctx.strokeStyle = SR.css('--line') || '#d9d4ca';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var y = 44; y < h; y += 44) { ctx.moveTo(14, y); ctx.lineTo(w - 14, y); }
    ctx.stroke();
  }

  /* ---------- styles ---------- */
  SR.style('problem', [

  /* ---------- a session: one problem, from the call to the result ---------- */
  function makeSession(host, p, o) {
    o = o || {};
    var token = ++seq, inline = o.mode === 'inline', comp = p.kind === 'competition', thm = p.kind === 'theorem';
    var S = readState(p.id), dead = false, timer = 0, armed = null, armTimer = 0, offs = [], bodyDone = false;
    var root = document.createElement('div');
    root.className = 'pb ' + (inline ? 'pb-inline no-ink' : 'pb-sheet') + (thm ? ' pb-thm' : '');
    root.setAttribute('data-problem', p.id);
    root.innerHTML = skeleton();
    host.appendChild(root);
    function q(sel) { return root.querySelector(sel); }
    /* Hidden is fixed when the call is committed; before that it follows how the problem was opened. */
    function hidden() { return S.phase !== 'call' && typeof S.hidden === 'boolean' ? S.hidden : o.hidden === true; }
    function reach() { return S.phase !== 'call' && typeof S.reach === 'boolean' ? S.reach : o.reach === true; }
    function settled() { return S.phase === 'settled'; }
    function moot() { return S.verdict === 'moot'; }
    function afterInk() { return S.gaveUp || settled(); }
    /* The first tick step (what the call named) comes before any solution text: after a verdict, or right
       after giving up. Only then does the solution open, so those ticks are made without it in view. */
    function ticksOpen() { return (settled() || S.gaveUp) && !moot(); }
    function solutionOpen() { return (S.gaveUp || settled()) && (S.calledDone || moot()); }
    /* The verdict can be changed (two taps) until the call ticks are confirmed and the solution opens. */
    function verbsOpen() { return S.phase === 'attempt' || (settled() && !S.calledDone && !S.recorded && !moot()); }
    function save() { if (!dead) writeState(S, token); }

    function skeleton() {
      var chips = CONF.map(function (c) { return '<button type="button" data-conf="' + c + '">' + c + '%</button>'; }).join('');
      var verbs = VERBS.map(function (x) {
        return '<button type="button" data-verb="' + x.v + '"><span>' + esc(x.label) + '</span><small>' + esc(x.sub) + '</small></button>';
      }).join('');
      return (inline ? '<div class="pb-hookbar"><span class="sr-kick">' + (thm ? (p.worked ? 'Work it' : 'Prove it') + ', problem first' : o.hook ? 'Problem first' : 'Problem') + '</span>' +
          (thm ? '<span class="sr-hint">Push level 3: call the method and your plan before you write ' + (p.worked ? 'the working' : 'the proof') + '.</span>'
            : o.hook ? '<span class="sr-hint">Call it before you read on: the page below names methods.</span>' : '') +
          '<span class="sp"></span><button type="button" data-pb="panel">Open in a panel</button></div>' : '') +
        '<div class="sr-card pb-card"><div class="pb-head"><span class="sr-kick pb-kick"></span><span class="pb-badges"></span></div>' +
          '<div class="pb-body"></div><div class="pb-meta sr-hint"></div></div>' +
        '<div class="sr-card pb-callsec"><div class="pb-row"><span class="sr-kick">Call</span><span class="sp"></span><span class="sr-hint pb-stamp"></span></div>' +
          '<p class="sr-hint pb-callhint">In ink, above the commit line: the method you will use and your plan. Then tap a confidence to commit. Nothing below opens before that.</p>' +
          '<div class="pb-callink"></div>' +
          '<div class="pb-row pb-callrow"><button type="button" data-pb="cundo">Undo</button>' +
          '<span class="pb-chips" role="group" aria-label="Confidence">' + chips + '</span></div></div>' +
        '<div class="sr-fog pb-lock"><div class="bars"><span style="width:82%"></span><span style="width:61%"></span><span style="width:90%"></span><span style="width:47%"></span></div>' +
          '<p class="pb-lockmsg">Locked until you commit a call: the work paper, settling, the solution.</p></div>' +
        '<div class="pb-below" hidden>' +
          '<div class="sr-card pb-worksec"><div class="pb-row"><span class="sr-kick">Work</span><span class="sp"></span><span class="pb-timer">0:00</span></div>' +
            '<p class="sr-hint">Ink written after you settle or give up shows in <span class="pb-after">this colour</span>.</p>' +
            '<div class="pb-workink"></div>' +
            '<div class="pb-row" style="margin-top:8px"><button type="button" data-pb="wundo">Undo</button><button type="button" data-pb="more">More paper</button>' +
            '<span class="sp"></span><span class="sr-hint pb-wcount"></span></div></div>' +
          '<div class="sr-card pb-settlesec"><div class="sr-kick">Settle the call</div><p class="sr-hint pb-settlehint"></p>' +
            '<div class="pb-verbs">' + verbs + '</div>' +
            (comp ? '' : '<div class="pb-row pb-giveup"><button type="button" data-pb="giveup">Give up and open the solution</button></div>') + '</div>' +
          '<div class="sr-card pb-aftersec" hidden><div class="pb-row"><span class="sr-kick">Settled</span><span class="sp"></span><span class="sr-demo">' + esc(DEMO) + '</span></div>' +
            '<div class="pb-result"></div><div class="pb-reveal sr-hint" hidden></div>' +
            '<div class="pb-step pb-stepA" hidden><div class="pb-steph">1 &middot; Which methods did your call name?</div>' +
              '<p class="sr-hint">Read your call above and tick what it named. The solution opens after this, so these ticks are yours alone.</p>' +
              '<div class="pb-toggles" data-list="called"></div>' +
              '<div class="pb-row"><button type="button" class="primary" data-pb="calldone">These are what my call named</button></div></div>' +
            '<div class="pb-sum pb-sumA sr-hint" hidden></div>' +
            '<div class="pb-step pb-stepB" hidden><div class="pb-steph">2 &middot; Which methods did it actually take?</div>' +
              '<p class="sr-hint pb-stepBhint"></p><div class="pb-guess sr-hint" hidden></div>' +
              '<div class="pb-toggles" data-list="took"></div>' +
              '<div class="pb-row"><button type="button" class="primary" data-pb="tookdone">Save and settle</button><span class="sr-hint pb-tookn"></span></div></div>' +
            '<div class="pb-final" hidden></div></div>' +
          '<div class="sr-card pb-solsec"><div class="sr-kick">' + (comp ? 'Solutions' : 'Solution') + '</div><div class="pb-sol"></div></div>' +
        '</div>';
    }

    var callInk = SR.ink.create(q('.pb-callink'), {
      width: W, height: CALL_H, className: 'pb-band',
      strokes: function () { return S.call; },
      readOnly: function () { return dead || S.phase !== 'call'; },
      background: commitLine,
      onChange: function () { save(); renderCall(); }
    });
    var workInk = SR.ink.create(q('.pb-workink'), {
      width: W, height: function () { return S.workH || WORK_H; },
      strokes: function () { return S.work; },
      readOnly: function () { return dead || S.phase === 'call'; },
      background: ruled,
      color: function (st) { return st && st.e ? '--after' : '--ink'; },
      meta: function () { return afterInk() ? { e: 1 } : null; },
      onChange: function () { save(); renderWorkCount(); }
    });
    var giveTap = q('[data-pb="giveup"]') ? SR.twoTap(q('[data-pb="giveup"]'), 'Tap again to give up and open it', giveUp) : null;

    /* ----- rendering ----- */
    function render() {
      if (dead) return;
      renderCard(); renderCall(); renderLock(); renderWork(); renderSettle(); renderAfter(); renderSol(); syncTimer();
      callInk.setReadOnly(null);
      workInk.setReadOnly(null);
      relayout();
    }
    function relayout() { if (inline && typeof o.relayout === 'function') o.relayout(); }
    function renderCard() {
      q('.pb-kick').textContent = thm ? (p.worked ? 'Work it · ' : 'Prove it · ') + (p.title || p.label || p.id) : 'Problem · ' + (p.label || p.id) + ' · d ' + fmtD(p.d);
      var b = '';
      if (thm) b += '<span class="sr-badge">' + esc(titleOf(p.basic)) + '</span>';
      else if (hidden()) b += '<span class="pb-q" title="Topic hidden" aria-label="Topic hidden">?</span><span class="sr-hint">topic hidden</span>';
      else if (p.area) b += '<span class="sr-badge">' + esc(areaName(p.area)) + '</span>';
      if (reach()) b += '<span class="sr-badge pb-reach">reach</span>';
      q('.pb-badges').innerHTML = b;
      if (!bodyDone) {
        bodyDone = true;
        var body = q('.pb-body'), al = archiveLink(p);
        if (comp) {
          body.innerHTML = '<div class="pb-comp">' + esc(p.label || p.id) + '</div>' +
            (al ? '<p><a class="pb-ext" href="' + esc(al) + '" target="_blank" rel="noopener">Open the problem in the Putnam archive' + (yearOf(p) ? ' (' + yearOf(p) + ', PDF)' : '') + ' &#8599;</a></p>' : '') +
            '<p class="sr-hint">Competition problems appear here by source and number only. Work it from the archive page.</p>';
        } else if (thm && inline) {
          /* inside its fog block the theorem is printed just above; the panel view repeats it */
          body.innerHTML = '<p class="sr-hint">The ' + (p.worked ? 'question' : 'statement') + ' is the one just above this card.</p>';
        } else {
          body.innerHTML = '<div class="pb-stmt">' + cleanHtml(p.statement || '<p>(No statement in this build.)</p>') + '</div><p class="sr-by">' + esc(MODEL) + '</p>';
          SR.typeset(body).then(relayout);
        }
      }
      renderMeta();
    }
    function renderMeta() {
      var h = '', r0 = S.res;
      if (thm) {
        var st = hasE('stage') ? +ecall('stage', p.basic) : NaN;
        q('.pb-meta').innerHTML = (p.worked ? 'The question above' : 'The theorem above') + ', posed as a problem. Settling grades ' + esc(titleOf(p.basic)) +
          (isFinite(st) ? ' (stage ' + st + ' now)' : '') + ' like a drill: held clean, held after help shaky, missed or blind failed. ' +
          'Your rating does not move. <span class="sr-demo">' + esc(DEMO) + '</span>';
        return;
      }
      if (S.recorded && r0 && isFinite(+r0.E)) h += 'Settled at E ' + f2(r0.E) + ' &middot; d ' + fmtD(p.d);
      else {
        var E = expectedFor(p);
        if (E != null) h += hidden() ? 'E ' + f2(E) + ' (expected score)' : 'E ' + f2(E) + ' &middot; your r ' + f2(rating(p.area)) + ' in ' + esc(areaName(p.area));
      }
      h += ' <span class="sr-demo">' + esc(DEMO) + '</span>';
      if (o.why) h += '<div>' + esc(o.why) + '</div>';
      if (comp && !hidden()) h += '<div>' + esc(GUESS) + '</div>';
      q('.pb-meta').innerHTML = h;
    }
    function renderCall() {
      var frozen = S.phase !== 'call', n = S.call.length;
      q('.pb-callsec').classList.toggle('pb-frozen', frozen);
      var u = q('[data-pb="cundo"]');
      u.hidden = frozen;
      u.disabled = !n;
      [].forEach.call(root.querySelectorAll('[data-conf]'), function (b) {
        var c = +b.getAttribute('data-conf');
        b.disabled = frozen || !n;
        b.classList.toggle('sel', S.conf === c);
        b.hidden = frozen && S.conf !== c;
      });
      q('.pb-callhint').hidden = frozen;
      q('.pb-stamp').textContent = frozen ? 'Committed ' + clock(S.committedAt) + ' · ' + S.conf + '% · read-only'
        : n ? 'Tap a confidence to commit.' : 'Confidence unlocks once the call has ink.';
    }
    function renderLock() {
      var locked = S.phase === 'call';
      q('.pb-lock').hidden = !locked;
      q('.pb-below').hidden = locked;
    }
    function renderWork() {
      q('[data-pb="more"]').disabled = (S.workH || WORK_H) >= WORK_MAX;
      renderWorkCount();
      renderTimer();
    }
    function renderWorkCount() {
      var n = S.work.length;
      q('.pb-wcount').textContent = n ? plural(n, 'stroke') : '';
      q('[data-pb="wundo"]').disabled = !n;
    }
    function renderTimer() {
      var t = q('.pb-timer'), on = S.phase === 'attempt';
      t.classList.toggle('on', on);
      t.textContent = S.phase === 'call' ? 'not started' : on ? SR.fmt.dur(Date.now() - (S.committedAt || Date.now())) : SR.fmt.dur(S.ms || 0) + ' · settled';
    }
    function syncTimer() {
      if (S.phase === 'attempt' && !timer) timer = setInterval(function () { if (!dead) renderTimer(); }, 1000);
      else if (S.phase !== 'attempt' && timer) { clearInterval(timer); timer = 0; }
    }
    function renderSettle() {
      var open = verbsOpen();
      [].forEach.call(root.querySelectorAll('[data-verb]'), function (b) {
        var v = b.getAttribute('data-verb'), x = null;
        for (var i = 0; i < VERBS.length; i++) if (VERBS[i].v === v) x = VERBS[i];
        var isArmed = open && armed === v;
        b.classList.toggle('sel', S.verdict === v);
        b.classList.toggle('armed', isArmed);
        b.disabled = !open || S.verdict === v;
        b.hidden = v === 'help' && S.gaveUp && S.verdict !== 'help';
        b.querySelector('small').textContent = isArmed ? (settled() ? 'tap again to change' : 'tap again to settle')
          : (v === 'held' && S.gaveUp ? 'the call worked (after help)' : x.sub);
      });
      var g = q('[data-pb="giveup"]');
      if (g) g.hidden = S.gaveUp || settled();
      q('.pb-settlehint').textContent = !settled()
        ? (S.gaveUp ? (S.calledDone ? 'You gave up and the solution is open below. Now settle the call: did the method you named work? Two taps.'
            : 'You gave up. First tick what your call named, below; the solution opens after that. Then settle the call here (two taps).')
          : 'When you are done, settle the call: did the method you named work? Each verb takes two taps.')
        : open ? 'Verdict: ' + verdictText(S) + '. Two taps on another verb change it, until you confirm the ticks below.'
        : 'Settled ' + verdictText(S) + (S.ms != null ? ' at ' + SR.fmt.dur(S.ms) : '') + '.';
    }
    function renderToggles(list) {
      var box = q('.pb-toggles[data-list="' + list + '"]'), sel = list === 'called' ? S.called : S.took;
      var h = methodChoices(p).map(function (m) {
        var on = sel.indexOf(m.id) >= 0;
        return '<button type="button" data-m="' + esc(m.id) + '" data-list="' + list + '" aria-pressed="' + on + '"' + (on ? ' class="on"' : '') + '>' + esc(m.label) + '</button>';
      }).join('');
      if (list === 'called') h += '<button type="button" data-pb="cnone" aria-pressed="' + !!S.calledNone + '"' + (S.calledNone ? ' class="on"' : '') + '>none of these</button>';
      box.innerHTML = h;
    }
    function renderAfter() {
      var sec = q('.pb-aftersec');
      sec.hidden = !settled() && !S.gaveUp;
      if (sec.hidden) return;
      var r = S.res || {}, m = moot();
      q('.pb-result').innerHTML = !settled() ? '<b>Gave up</b> <span class="sr-hint">&middot; settle the call above once the solution is open</span>'
        : S.recorded ? resultHtml(r, m)
        : '<b>' + esc(verdictText(S)) + '</b>' + (S.ms != null ? ' &middot; ' + SR.fmt.dur(S.ms) : '') + (S.conf != null ? ' &middot; called at ' + S.conf + '%' : '') +
          ' <span class="sr-hint">&middot; ' + (thm ? 'the basic\'s stage updates' : 'the rating updates') + ' when you save the ticks below</span>';

      var a = m.att, st = cur.steps[L.step], name = st && st.topic ? ' (' + st.topic + ')' : '';
      if (!a.strokes.length) return 'on a blank page';

    }
    function renderStats() {
      var a = m.att, lens = an.stalls.map(function (s) { return s.to - s.from; });
      var stallTot = lens.reduce(function (x, v) { return x + v; }, 0), L = an.longest;
      var hist = histOf(m.key).filter(function (e) { return e.t0 !== a.start; }).slice(-4).reverse();
      D.stats.innerHTML = '<div class="sr-kick">Where the time went</div><dl>' +
        '<dt>Total</dt><dd>' + dur(an.total) + '</dd>' +
        '<dt>Inking</dt><dd>' + dur(an.inking) + ' (' + Math.round(100 * an.inking / Math.max(1, an.total)) + '%) in ' + an.strokes + ' stroke' + (an.strokes === 1 ? '' : 's') + '</dd>' +
        '<dt>Stalls</dt><dd>' + (lens.length ? lens.length + ' over 30 s: ' + lens.map(dur).join(', ') + ' (total ' + dur(stallTot) + ')' : 'none over 30 s') + '</dd>' +
        '<dt>Longest</dt><dd>' + (L ? esc(dur(L.to - L.from) + ' at ' + dur(L.from) + ', ' + stallPlace(L)) + (a.strokes.length ? '<em class="drl-guess">guess</em>' : '') : 'no stall over 30 s') + '</dd>' +
        '</dl><p class="drl-fine">Step guess: the inked part of the page is cut into ' + an.steps + ' equal bands, top to bottom, one per model step, and the stroke after the stall picks the band. It does not read your ink.</p>' +
        (hist.length ? '<p class="drl-hist">Earlier attempts: ' + hist.map(function (e) {
          return esc(shortDay(e.day) + ' ' + e.grade + (e.gaveUp ? ' (gave up)' : '') + ', ' + dur(e.total));
        }).join(' · ') + '</p>' : '');
    }
    function renderSteps() {
      var a = m.att, L = an && an.longest, hasInk = a.strokes.length > 0;
      var h = '<div class="sr-kick">The model’s version, step by step</div><p class="sr-by drl-by">' + esc(SR.LABEL_MODEL || LABEL_MODEL) + '</p><ol class="drl-steps">';
      if (!cur.steps.length) h += '<li>The demo content has no steps for this drill.</li>';
      cur.steps.forEach(function (st, i) {
        var g = !!(L && hasInk && L.step === i);
        h += '<li' + (g ? ' class="guess"' : '') + '><div class="drl-sth"><span class="drl-stn">Step ' + (i + 1) + '</span>' + esc(st.topic) +
          (g ? '<span class="drl-stg">longest stall ' + (L.next >= 0 ? 'before' : 'after') + ' this (guess)</span>' : '') + '</div>' +

    }
    function resNotes(res) {
      var out = [];
      if (res.capped && res.deadline) out.push('The interval is capped at ' + res.interval + ' d by ' + deadlineText(res.deadline) + ': at most a third of the days left.');
      if (res.sameDay && res.grade === 'clean') out.push('The stage already rose today; it rises at most once a day.');
      if (res.pushAfter != null && res.pushBefore != null && res.pushAfter !== res.pushBefore) {
        out.push('Push level ' + res.pushBefore + ' → ' + res.pushAfter + ': proofs in this basic now open as ' + (PUSH_TEXT[res.pushAfter] || 'level ' + res.pushAfter) + '.');
      }

    }
    function renderGrade() {
      var a = m.att, b = cur.basic, res = a.res, g = a.grade, iv = intervals();
      var from = res ? res.stageBefore : stageOf(b);
      var h = '<div class="sr-kick">Grade yourself</div>';
      if (a.gaveUp) h += '<p class="drl-note">You gave up, so this attempt counts as failed.</p>';
      else if (!g) h += '<p class="drl-note">Compare your page with the steps. Clean: every step there, in order. Shaky: there, with a gap or a slip. Failed: a step missing.</p>';
      h += '<div class="drl-gb" role="group" aria-label="Grade">' + GRADES.map(function (x) {
        var sub = x === 'clean' ? 'stage +1' : x === 'shaky' ? 'stage stays' : 'back to 0';
        return '<button type="button" data-grade="' + x + '" class="g-' + x + (g === x ? ' sel' : '') + '" aria-pressed="' + (g === x) + '"' +
          (g || !b ? ' disabled' : '') + '>' + cap(x) + '<small>' + sub + '</small></button>';
      }).join('') + '</div>';
      h += '<div class="drl-ladder"><div class="drl-marker">▼ stage</div><div class="drl-rungs">' +
        iv.map(function (v, i) { return '<div class="drl-rung" data-i="' + i + '"><b>' + i + '</b>' + v + ' d</div>'; }).join('') + '</div></div>';
      var next = '';
      if (res) {
        var days = typeof res.interval === 'number' ? res.interval : dayDiff(res.due, a.gradeDay || today());
        next = esc(cap(g) + ': stage ' + res.stageBefore + ' → ' + res.stageAfter + '. Next due ' + (validDay(res.due) ? dayLabel(res.due) : '?') +
          ' (in ' + days + ' d).') + resNotes(res).map(function (t) { return '<br><span class="drl-note">' + esc(t) + '</span>'; }).join('');
      } else if (g && !b) next = 'Graded ' + esc(g) + '. No basic is named, so nothing was recorded.';
      else if (g) next = 'Graded ' + esc(g) + '. The engine did not record it.';
      else if (b) {
        var dl = ecall('deadline', b), up = Math.min(5, from + 1), rose = ecall('roseToday', b) === true;
        next = esc('Now at stage ' + from + '. Clean → ' + (rose ? from + ', since it already rose today' : up) + ' (' + cappedIv(rose ? from : up, dl) + ' d), shaky stays ' + from +
          ' (' + cappedIv(from, dl) + ' d), failed → 0 (' + cappedIv(0, dl) + ' d).');
      } else next = 'No basic is named for this drill, so a grade is not recorded.';
      D.grade.innerHTML = h + '<p class="drl-next">' + next + '</p>';
      if (res && animate) {
        animate = false;
        setLadder(res.stageBefore);
        var mk = D.grade.querySelector('.drl-marker');
        if (mk) void mk.offsetWidth;
        setTimeout(function () { if (!dead && m && m.att && m.att.res) setLadder(m.att.res.stageAfter); }, 80);
      } else setLadder(res ? res.stageAfter : from);
    }
    function setLadder(n) {
      var mk = D.grade.querySelector('.drl-marker');
      if (!mk) return;
      mk.style.left = ((n + 0.5) / 6 * 100) + '%';
      [].forEach.call(D.grade.querySelectorAll('.drl-rung'), function (r) {
        var i = +r.getAttribute('data-i');
        r.classList.toggle('on', i < n);
        r.classList.toggle('cur', i === n);
      });
    }

    /* ---------- replay ---------- */
    function updHead() {
      var a = m && m.att;
      if (!a || a.end == null || !an) return;
      var tot = Math.max(1, a.end), hd = D.tl.querySelector('.head');
      if (hd) hd.style.left = (clamp(rp.T / tot, 0, 1) * 100) + '%';
      D.rpt.textContent = dur(rp.T) + ' / ' + dur(a.end);
      D.tl.setAttribute('aria-valuenow', String(Math.round(rp.T / 1000)));
      D.tl.setAttribute('aria-valuetext', dur(rp.T) + ' of ' + dur(a.end));
      [].forEach.call(D.bdgs.children, function (bd) {
        var s = an.stalls[+bd.getAttribute('data-i')];
        bd.style.visibility = s && rp.T >= s.to ? 'visible' : 'hidden';
      });
    }
    function updRpUI() {
      D.play.textContent = rp.playing ? 'Pause' : 'Play';
      [].forEach.call(D.seg.children, function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-speed') === rp.speed)); });
      D.tmap.setAttribute('aria-pressed', String(rp.tmap));
      D.legend.hidden = !rp.tmap;
      updHead();
    }
    function setT(t) {
      var a = m && m.att;
      if (!a || a.end == null) return;
      rp.T = clamp(+t || 0, 0, a.end);
      ink.redraw();
      updHead();
    }
    function frame(now) {
      rp.raf = 0;
      if (!rp.playing || dead) return;
      var a = m && m.att;
      if (!a || a.end == null || !root.isConnected) { pause(true); return; }
      rp.T += Math.max(0, now - rp.last) * rp.speed;
      rp.last = now;
      if (rp.T >= a.end) { rp.T = a.end; rp.playing = false; }
      ink.redraw();
      if (rp.playing) { updHead(); rp.raf = requestAnimationFrame(frame); } else updRpUI();
    }
    function play() {
      var a = m && m.att;
      if (!a || a.end == null) return;
      if (rp.T >= a.end) rp.T = 0;
      rp.playing = true;
      rp.last = performance.now();
      if (!rp.raf) rp.raf = requestAnimationFrame(frame);
      updRpUI();
    }
    function pause(silent) {
      rp.playing = false;
      if (rp.raf) { cancelAnimationFrame(rp.raf); rp.raf = 0; }
      if (!silent && phase() === 'done') updRpUI();
    }
    function setSpeed(s) { if (SPEEDS.indexOf(+s) < 0) return; rp.speed = prefs.speed = +s; updRpUI(); }
    function setTmap(on) { rp.tmap = !!on; ink.redraw(); updRpUI(); }
    function seekEvent(e) {
      var a = m && m.att;

      setT(clamp((e.clientX - r.left) / (r.width || 1), 0, 1) * a.end);
    }

      if (e.pointerType === 'mouse' && e.button !== 0) return;

      try { D.tl.setPointerCapture(e.pointerId); } catch (_) {}

    /* ---------- actions ---------- */
    function publicAtt() { return m && m.att ? copy(m.att) : null; }
    function cb(name) {
      if (typeof spec[name] !== 'function') return;
      try { spec[name].apply(null, [].slice.call(arguments, 1)); } catch (e) { console.error('[SR] drill ' + name + ' callback failed:', e); }
    }
    function doStart() {
      if (!m || m.att) return;
      m.att = { v: 1, start: Date.now(), end: null, strokes: [], H: H_PAGE, grade: null, res: null, gaveUp: false,
        day: today(), fogId: cur.fogId, basic: cur.basic };

      sync();

    }
    function doDone(gaveUp) {
      var a = m && m.att;
      if (!a || a.end != null) return;

      sync();
      notify(m, inst);

    }

      var a = m && m.att;

      if (a.gaveUp && g !== 'failed') return;
      var res = null;
      if (cur.basic) { busy = true; try { res = ecall('recordDrill', cur.basic, g) || null; } finally { busy = false; } }
      a.grade = g;
      a.gradeDay = today();
      a.res = res ? copy({ basic: res.basic, grade: res.grade, stageBefore: res.stageBefore, stageAfter: res.stageAfter, pushBefore: res.pushBefore,
        pushAfter: res.pushAfter, due: res.due, interval: res.interval, capped: !!res.capped, sameDay: !!res.sameDay, deadline: res.deadline || null }) : null;
      var L = an && an.longest;
      histPush(m.key, { day: a.gradeDay, t0: a.start, grade: g, total: a.end, gaveUp: !!a.gaveUp, strokes: a.strokes.length,
        longest: L ? L.to - L.from : 0 });

      sync();

    }

      var a = m && m.att;

      notify(m, inst);

      else if (act === 'play') { if (rp.playing) pause(); else play(); }
      else if (act === 'tmap') setTmap(!rp.tmap);

    function destroy() {
      if (dead) return;
      dead = true;
      stopTimer();
      pause(true);
      offs.forEach(function (off) { try { off(); } catch (e) {} });
      offs = [];
      if (ro) { ro.disconnect(); ro = null; }
      try { giveTap.destroy(); againTap.destroy(); } catch (e) {}
      try { ink.destroy(); } catch (e2) {}
      detach();
      if (el.__srDrill === api) el.__srDrill = null;
    }

    if (SR.bus) {
      offs.push(SR.bus.on('theme', function () { pal = null; if (!dead) ink.redraw(); }));
      offs.push(SR.bus.on('engine:change', function () {
        if (dead || busy || !m) return;
        renderHead();
        if (phase() === 'done' && !m.att.grade) ensureDone();

    }

    }

      el: root,
      key: function () { return m ? m.key : null; },
      fogId: function () { return cur.fogId; },
      basic: function () { return cur.basic; },
      proofs: function () { return list.slice(); },

      attempt: publicAtt,
      analysis: function () { return an ? copy(an) : null; },

      play: play,

  /* ---------- a drill in a sheet (Today, the scaffold's "Drill the basic instead") ---------- */
  function open(target, opts) {
    opts = opts || {};

    var sh = SR.sheet.open({ id: 'drill-' + (basic || fogId), title: 'Drill · ' + docTitle(basic || (F[fogId] || {}).doc), wide: true, keepOnNav: true });
    [].forEach.call(sh.body.children, function (c) { if (c.__srDrill) c.__srDrill.destroy(); });
    sh.body.innerHTML = '';
    var host = document.createElement('div');
    sh.body.appendChild(host);
    var api = run(host, { fogId: fogId, basic: basic, fixed: isFog, choose: opts.choose });
    return { sheet: sh, drill: api };
  }

  SR.drill = {
    run: run,
    open: open,
    carry: carry,
    analyse: analyse,
    frameList: frameList,
    STALL_MS: STALL,
    MIN_STROKES: MIN_STROKES
  };

  if (SR.bus) SR.bus.on('demo:reset', function () { models = Object.create(null); });

  /* <div class="blk" data-block="drill" data-id="FOG-ID">: that proof, cold.
     <div class="blk" data-block="drill" data-id="BASIC-ID">: the basic's proofs, with a switcher. */
  if (SR.blocks) {
    SR.blocks.register('drill', {
      mount: function (el, id, ctx) {
        var F = fogs(), spec;
        if (id && F[id]) spec = { fogId: id, basic: F[id].basic, fixed: true, choose: false, showStatement: true };
        else if (id && docOf(id)) spec = { basic: id, choose: true, showStatement: true };
        else {
          el.innerHTML = '<div class="blk-ph">Drill &middot; the demo content has no drill named ' + esc(id) + '.</div>';
          return {};
        }

        var api = run(el, spec);
        return { drill: api, destroy: function () { api.destroy(); } };
      }
    });
  }
})();

<script>
/* src/panel-map.js */
/* panel-map.js: the Today and Map panels behind the reader header's Today and Map buttons.
   Today: engine.todayPlan(). The drills due (ranked, with why), the next ship date, the day's problem and
   kata slots with d and E (a hidden-topic pick shows "?" where the topic would be and nothing that names a
   method), and what was settled today. Map: the basics of each track as a graph (fill = drill stage, rings =
   push level, fogged = every prerequisite below stage 2), the sample ledger tasks with ship dates and the
   weak basics that block them (engine.blockers), ratings with sparklines and the stretch band on a
   difficulty ladder, and method-identification accuracy beside solve rate.
   Written by a model for Adit. Not Adit's words. Everything shown is demo data from the simulated engine.
   Plain browser script. Attaches SR.panels = {init, open, today, map, refresh}; the reader's openPanel calls

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var AREA_NAMES = { nt: 'Number theory & algebra', cp: 'Combinatorics & probability', an: 'Analysis',
    lg: 'Linear algebra & geometry', dd: 'Digital design', gr: 'General reasoning' };

  var TRACK_SHORT = { putnam: 'Putnam', asic: 'ASIC' };
  var CLOSED = /^(done|x|closed|shipped|cancelled|canceled)$/i;
  /* Putnam positions on the d scale: A1/B1 3, A2/B2 4, A3/B3 5.5, A4/B4 6.5, A5/B5 8, A6/B6 9.5. */
  var RUNGS = [[3, 1], [4, 2], [5.5, 3], [6.5, 4], [8, 5], [9.5, 6]];
  var PUSH_TEXT = [
    'Level 0: proofs fogged step by step; each reveal needs 3 new strokes.',
    'Level 1: proof steps merged into two bigger chunks.',
    'Level 2: proofs fully hidden; you write them cold as a blank-page drill.',
    'Level 3: theorems turn into problem-first hooks, and the area gets hidden-topic slots.'
  ];
  var S = { inited: false, sel: null, plan: null, ctx: null, timer: 0 };

  /* ---------- guarded access ---------- */
  function esc(s) {
    if (SR.esc) return SR.esc(s);
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  }
  function has(fn) { var e = SR.engine; return !!(e && typeof e[fn] === 'function'); }

  }
  function K(name, d) { var e = SR.engine, c = e && e.constants; return c && c[name] != null ? c[name] : d; }
  function C() { return SR.content || {}; }
  function docMap() { return C().docs || {}; }
  function doc(id) { var m = docMap(); return id && HAS.call(m, id) ? m[id] : null; }
  /* Doc order: content.library first, then any other docs (the reader uses the same order). */
  function docIds() {

  }
  function taskRow(t, sc, ctx) {

      '<span class="pn-task-t">' + (t.priority ? '<span class="pn-pri" title="priority">!</span> ' : '') + esc(t.text) + '</span>' +
      '<span class="pn-flag ' + lab[1] + '">' + lab[0] + '</span></div>';

  function shipSec(ctx) {

  /* ---------- ratings ---------- */
  /* Within 0.25 of a rung (either side) reads as that rung; between two rungs, as the range. Closeness is
     tested against every rung before any range, so the labels are symmetric around each rung. */
  function ladderText(r) {
    if (!(r >= 2.75)) return 'below Putnam A1';
    var i;
    for (i = 0; i < RUNGS.length; i++) if (Math.abs(r - RUNGS[i][0]) <= 0.25) return 'Putnam A' + RUNGS[i][1] + ' level';
    for (i = 0; i + 1 < RUNGS.length; i++) {
      if (r > RUNGS[i][0] && r < RUNGS[i + 1][0]) return 'Putnam A' + RUNGS[i][1] + '–A' + RUNGS[i + 1][1] + ' level';
    }
    return 'Putnam A6 level';
  }
  function spark(hist) {
    var v = (hist || []).map(function (x) { return +x.r; }).filter(function (x) { return isFinite(x); });
    if (!v.length) return '';
    var w = 120, h = 36, lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    if (hi - lo < 0.5) { var m = (hi + lo) / 2; lo = m - 0.25; hi = m + 0.25; }
    var pts = v.map(function (r, i) {
      var x = v.length === 1 ? w - 6 : 6 + i * (w - 12) / (v.length - 1), y = h - 6 - (r - lo) / (hi - lo) * (h - 12);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var last = pts[pts.length - 1].split(',');
    return '<svg class="pn-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Rating history, ' + plural(v.length, 'point') + '">' +
      (v.length > 1 ? '<polyline points="' + pts.join(' ') + '"/>' : '<line class="flat" x1="6" x2="' + (w - 6) + '" y1="' + last[1] + '" y2="' + last[1] + '"/>') +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5"/></svg>';
  }
  /* The difficulty ladder (d from 1 to 10): the stretch band (E 0.60 to 0.70) and target (E 0.65), the
     hidden-topic pitch one step below, the reach pitch when it is open, and the rating r as a dot. */
  function ladder(a, r, tg, tgH, tgR) {
    var w = 340, h = 58, d0 = 1, d1 = 10, y = 30;
    function x(d) { d = Math.max(d0, Math.min(d1, +d)); return (12 + (d - d0) * (w - 24) / (d1 - d0)).toFixed(1); }
    function tick(cls, d, y1, y2) { return '<line class="' + cls + '" x1="' + x(d) + '" x2="' + x(d) + '" y1="' + y1 + '" y2="' + y2 + '"/>'; }
    var s = '<svg class="pn-lad" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Difficulty ladder: r ' + f2(r) +
      (tg ? ', stretch target d ' + f2(tg.d) : '') + '">';
    s += '<line class="ax" x1="' + x(d0) + '" x2="' + x(d1) + '" y1="' + y + '" y2="' + y + '"/>';
    if (areaTrack(a) === 'putnam') {
      RUNGS.forEach(function (g) { s += tick('rung', g[0], y - 7, y) + '<text x="' + x(g[0]) + '" y="' + (y - 11) + '" text-anchor="middle">A' + g[1] + '</text>'; });
    } else {
      katas().forEach(function (k) { if ((k.area || 'dd') === a && isFinite(+k.d)) s += tick('rung', k.d, y - 7, y); });
      s += '<text x="' + (w - 12) + '" y="' + (y - 11) + '" text-anchor="end">ticks: the katas in the bank</text>';
    }
    if (tg && tg.band) s += '<rect class="band" x="' + x(tg.band.lo) + '" y="' + (y - 7) + '" width="' + Math.max(3, x(tg.band.hi) - x(tg.band.lo)).toFixed(1) + '" height="14" rx="3"/>';
    if (tgH) s += tick('hid', tgH.d, y - 9, y + 9);
    if (tgR) s += tick('rch', tgR.d, y - 10, y + 10);
    if (tg) s += tick('tgt', tg.d, y - 10, y + 10);
    s += '<circle class="r" cx="' + x(r) + '" cy="' + y + '" r="6"/>';
    s += '<text x="' + x(d0) + '" y="' + (y + 22) + '">d 1</text><text x="' + x(d1) + '" y="' + (y + 22) + '" text-anchor="end">10</text>' +
      '<text class="rl" x="' + x(r) + '" y="' + (y + 22) + '" text-anchor="middle">r</text></svg>';
    return s;
  }
  function rateCard(a) {
    var r = +ecall('rating', a);
    if (!isFinite(r)) return '';
    var hist = ecall('history', a) || [], tg = ecall('target', a, {}) || null, tgH = ecall('target', a, { hidden: true }) || null;
    var st = ecall('streaks', a) || { miss: 0, clean: 0 }, push = !!ecall('inPush', a);
    var CR = K('CLEAN_RUN', 3), MR = K('MISS_RUN', 2), reachOpen = (st.clean || 0) >= CR;
    var tgR = reachOpen ? (ecall('target', a, { reach: true }) || null) : null;
    var acc = ecall('methodAccuracy', a) || { hits: 0, total: 0 }, sol = ecall('solveRate', a) || { held: 0, total: 0 };
    var notes = [];
    if (areaTrack(a) === 'putnam') notes.push(ladderText(r));
    if (tg) notes.push('target d ' + f2(tg.d) + (tg.eased ? ', eased one step' : ''));
    if ((st.miss || 0) >= MR) notes.push(st.miss + ' misses in a row: picks eased one step');
    else if (reachOpen) notes.push(st.clean + ' clean in a row: one reach allowed (E ' + f2(K('E_REACH', 0.4)) + ')');
    else if (st.clean > 0) notes.push('clean run ' + st.clean + ' of ' + CR);
    else if (st.miss > 0) notes.push('miss run ' + st.miss + ' of ' + MR);
    notes.push(sol.total ? 'held ' + sol.held + ' of ' + sol.total : 'nothing settled');
    if (acc.total) notes.push('method called ' + acc.hits + ' of ' + acc.total);
    return '<div class="pn-rate"><div class="pn-rate-h"><b>' + esc(areaName(a)) + '</b>' + (push ? '<span class="pn-flag after">push mode</span>' : '') +
      '<span class="pn-rv" title="rating r">' + f2(r) + '</span></div>' + ladder(a, r, tg, tgH, tgR) +
      '<div class="pn-rate-f">' + spark(hist) + '<span class="pn-rate-n">' + esc(notes.join(' · ')) + '</span></div></div>';
  }
  function ratingsSec() {
    var h = '<section class="pn-sec" data-sec="ratings"><h3 class="pn-h">Ratings</h3>' +
      '<p class="pn-sub">A pick of difficulty d has expected score E = 1/(1 + 10<sup>(d − r)/2</sup>). Held scores 1, held after help 0.75, missed or blind 0, moot nothing; then r ← r + 0.6(score − E).</p>' +
      '<div class="pn-rates">' + areaList().map(rateCard).join('') + '</div>' +
      '<div class="pn-key"><span><i class="k-r"></i>your rating r</span><span><i class="k-band"></i>stretch band, E ' + f2(K('E_LO', 0.6)) + '–' + f2(K('E_HI', 0.7)) +
      '</span><span><i class="k-tgt"></i>target, E ' + f2(K('E_TARGET', 0.65)) + '</span><span><i class="k-hid"></i>hidden-topic pitch, one step easier</span>' +
      '<span><i class="k-rch"></i>reach, E ' + f2(K('E_REACH', 0.4)) + ', after ' + K('CLEAN_RUN', 3) + ' clean in a row</span>' +
      '<span>A1–A6: Putnam positions A1/B1 … A6/B6 at d 3, 4, 5.5, 6.5, 8, 9.5</span><span>line: r after each settle</span></div></section>';

  }

  /* ---------- method identification ---------- */
  function accRow(label, a, sub, alt) {
    a = a || { hits: 0, total: 0 };

    return '<div class="pn-accrow' + (sub ? ' sub' : '') + '"><span class="l">' + esc(label) + '</span><span class="pn-num">' + a.hits + ' of ' + a.total + '</span>' +
      '<span class="pn-bar' + (alt ? ' alt' : '') + '"><i style="width:' + (rate == null ? 0 : Math.round(rate * 100)) + '%"></i></span><span class="pn-num pc">' + pct(rate) + '</span></div>';
  }
  function cueLink(m) {

  function methodsSec() {
    var all = ecall('methodAccuracy') || { hits: 0, total: 0 };
    var vis = ecall('methodAccuracy', null, { hidden: false }), hid = ecall('methodAccuracy', null, { hidden: true });
    var pr = ecall('methodAccuracy', null, { kind: 'problem' }), kt = ecall('methodAccuracy', null, { kind: 'kata' });
    var th = ecall('methodAccuracy', null, { kind: 'theorem' }) || { hits: 0, total: 0 };
    var sol = ecall('solveRate') || { held: 0, clean: 0, total: 0 };
    var h = '<section class="pn-sec" data-sec="methods"><h3 class="pn-h">Method identification</h3>' +
      '<p class="pn-sub">After a settle you tick the methods your call named and the methods the item took. A hit means the call named every method it took. ' +
      'It is counted apart from solving: you can solve without calling the method, or call it and still miss.</p>' +
      '<div class="pn-acc">' + accRow('Called the method', all) + accRow('topic given', vis, true) + accRow('topic hidden', hid, true) +
      accRow('problems', pr, true) + accRow('design katas', kt, true) + (th.total ? accRow('proofs at push 3', th, true) : '') +
      accRow('Held (help allowed)', { hits: sol.held, total: sol.total }, false, true) + accRow('held clean', { hits: sol.clean, total: sol.total }, true, true) + '</div>';

    settledAll().forEach(function (x) {
      var r = x.r;
      if (r.methodsPending || r.score === null || r.score === undefined) return;
      (r.took || []).forEach(function (m) {
        took[m] = (took[m] || 0) + 1;
        if ((r.called || []).indexOf(m) < 0) missed[m] = (missed[m] || 0) + 1;

    });
    var L = Object.keys(missed).sort(function (a, b) { return missed[b] - missed[a] || took[b] - took[a]; }).slice(0, 5);

    if (L.length) {

      }).join('') + '</ul>';
    } else {
      h += '<p class="pn-sub">' + (Object.keys(took).length ? 'None missed so far.' : 'Nothing settled with method ticks yet. Settle a problem or kata from Today to start the count.') + '</p>';
    }
    var topics = docIds().filter(function (id) { var d = doc(id); return d && d.kind === 'topic'; });
    if (topics.length) {
      h += '<div class="pn-kick">Recognise lists</div>' + topics.map(function (id) {
        var cues = has('recognise') ? (ecall('recognise', id) || []) : [];
        return '<div class="pn-recrow"><span><b>' + esc(title(id)) + '</b> <span class="pn-muted">' + plural(cues.length, 'cue') + ' logged</span></span>' +
          '<button type="button" data-act="changes" data-doc="' + esc(id) + '">Open Changes</button>' +
          (cues.length ? '<ul class="pn-list">' + cues.slice(-3).reverse().map(function (e) { return '<li>' + esc(e.text) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      }).join('') +
        '<p class="pn-sub">A cue is logged when a settled item took a method whose basic you hold at stage ' + K('KNOWN_STAGE', 3) + ' or more and your call did not name it.</p>';
