name: Release

# Push a tag equal to the manifest version (e.g. 0.0.3) to build the plugin and publish a
# release that BRAT can install on the iPad.
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build main.js
        run: npm run build
      - name: Check tag matches manifest version
        run: test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes "Notebook plugin $GITHUB_REF_NAME"
